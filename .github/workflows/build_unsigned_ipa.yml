name: "Apple: Unsigned iOS IPA (all features)"

on:
  workflow_dispatch:
  push:
    branches: [ci/unsigned-ipa]

defaults:
  run:
    working-directory: app-apple

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: partout-io/action-prepare-xcode-build@master
        with:
          access-token: ${{ github.token }}
          submodules: true
      - uses: partout-io/setup-zig@main
      - uses: actions/setup-go@v7
        with:
          go-version: 1.24
          cache-dependency-path: partout/src/**/go.sum
      - name: Build Partout XCFramework
        run: |
          prebuilts_version=$(tr -d '\r\n' < "$GITHUB_WORKSPACE/.prebuilts-version")
          "$GITHUB_WORKSPACE/partout/scripts/build-xcframework.sh" \
            "$prebuilts_version" --out "$PWD/PartoutNative.xcframework" \
            --prebuilts-out "$RUNNER_TEMP/partout-prebuilts" --full
      - name: Enable all features (enterprise distribution target)
        run: |
          sed -i '' 's/distributionTarget = \.appStore/distributionTarget = .enterprise/' \
            Passepartout/App/Context/AppContext+Production.swift \
            Passepartout/Tunnel/PacketTunnelProvider.swift
          sed -i '' 's/fatalError("No URL for enterprise distribution")/return appConfiguration.constants.websites.appStoreDownloadURL/' \
            Passepartout/App/Context/AppContext+Production.swift
          git diff --stat
      - name: Archive without signing
        run: |
          xcodebuild archive \
            -project Passepartout.xcodeproj \
            -scheme Passepartout \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Passepartout.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          app=$(ls -d build/Passepartout.xcarchive/Products/Applications/*.app)
          mkdir -p Payload && cp -R "$app" Payload/
          zip -qry Passepartout-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: Passepartout-unsigned-ipa
          path: app-apple/Passepartout-unsigned.ipa
          if-no-files-found: error
